[package]
name = "quire-core"
version = "0.1.0"
edition = "2021"
description = "Quire's document and database model, the SQLite store behind it, and the services that need no window — the crate the desktop shell, the Android port and the future sync module share."
# Extracted from the `quire` desktop repository on 2026-09-23: 69 commits of
# history for `src/core`, `src/storage`, `src/services`, `src/testing.rs` and the
# five integration suites that name only them, carried out with git-filter-repo.
# The shell lives on at the parent project and depends on this by pinned rev.

[workspace]
# Empty on purpose, and it must stay: without this table cargo walks *up* the
# directory tree and adopts the desktop project's workspace, which is exactly
# where this checkout currently sits. Harmless once the directory is moved out,
# protective if anyone ever vendors it under another workspace root.

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
# The sync snapshot's wire format (services::sync). Pure Rust, no system deps:
# the Android `.so` links both without a TLS/OpenSSL story.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Integration tests, one target each, keeping the names `cargo test --test …`
# has used since the app's M3.
[[test]]
name = "storage"
path = "tests/storage_test.rs"

[[test]]
name = "markdown"
path = "tests/markdown_test.rs"

[[test]]
name = "search"
path = "tests/search_test.rs"

[[test]]
name = "find"
path = "tests/find_test.rs"

[[test]]
name = "backup"
path = "tests/backup_test.rs"
